name: leafy
description: "A new Flutter assignment."
publish_to: "none"
version: 1.0.0+1
environment:
  sdk: ^3.11.0
dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  go_router: ^13.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  # To add assets to your application, add an assets section, like this:
  assets:
    - assets/images/image5.jpg

  fonts:
    - family: Quicksand
      fonts:
        - asset: assets/fonts/QuicksandLight.ttf
          weight: 300
        - asset: assets/fonts/QuicksandRegular.ttf
          weight: 400
        - asset: assets/fonts/QuicksandMedium.ttf
          weight: 500
        - asset: assets/fonts/QuicksandSemiBold.ttf
          weight: 600
        - asset: assets/fonts/QuicksandBold.ttf
          weight: 700
